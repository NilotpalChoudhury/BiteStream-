<rect x="40" y="618" width="1180" height="136" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="56" y="640" font-size="13" font-weight="700" fill="#1f2937">Key constraints, indexes and triggers</text>
<text x="56" y="660" font-size="12" font-weight="400" fill="#1f2937">• idx_active_user_order: UNIQUE (user_id) WHERE status IN ('PREPARING','DELIVERING'). At most one active order per user.</text>
<text x="56" y="680" font-size="12" font-weight="400" fill="#1f2937">• trg_wallet_audit_immutable: BEFORE UPDATE OR DELETE on wallet_audit_logs → error (the audit trail is insert-only).</text>
<text x="56" y="700" font-size="12" font-weight="400" fill="#1f2937">• sp_execute_checkout (Workflow 1): own REPEATABLE READ txn → lock user → debit (CHECK) → insert order → COMMIT / ROLLBACK.</text>
<text x="56" y="720" font-size="12" font-weight="400" fill="#1f2937">• idx_orders_delivered_created_at_covering: (created_at) INCLUDE (restaurant_id, total_amount) WHERE status='DELIVERED'. Index Only Scan for Workflow 2.</text>
<text x="56" y="740" font-size="12" font-weight="400" fill="#1f2937">• Both views have a UNIQUE index so REFRESH MATERIALIZED VIEW CONCURRENTLY works (fn_refresh_restaurant_revenue_summary / _daily_revenue).</text>
<text x="40" y="788" font-size="11" fill="#6b7280">PK = primary key (amber) · FK = foreign key (blue) · crow's foot = "many" side · dashed boxes (MV) = materialized views</text>
</svg>